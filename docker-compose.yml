services:
  postgres:
    image: postgres:16-alpine
    container_name: adarkroom-db
    environment:
      POSTGRES_DB: adarkroom_dev
      POSTGRES_USER: adr
      POSTGRES_PASSWORD: adarkroom_dev_pw
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adr -d adarkroom_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
